<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres Marias Catering Services - Logo</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    // If admin is already logged in with a valid token, redirect directly to dashboard
    if (sessionStorage.getItem('tres_marias_token') && sessionStorage.getItem('tres_marias_admin_logged_in') === 'true') {
      window.location.replace('dashboard.html');
    }
  </script>
</head>
<body>

  <!-- Pure HTML & CSS only: Logo circle linking to login.html -->
  <a href="login.html" class="logo-circle" title="Tres Marias Catering Services - Click to Login">
    <img src="../assets/images/logo.jpg" alt="Tres Marias Catering Services Logo" class="logo-img" width="220" height="220" fetchpriority="high" decoding="async">
  </a>

</body>
</html>
