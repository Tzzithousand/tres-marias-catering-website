<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tres Marias Admin - Login</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <script>
    // Immediate Route Guard: If admin has an active session and token, redirect directly to dashboard
    if (sessionStorage.getItem('tres_marias_token') && sessionStorage.getItem('tres_marias_admin_logged_in') === 'true') {
      window.location.replace('dashboard.html');
    }
  </script>
</head>
<body>

  <div class="login-container">
    <!-- Logo above Login Box -->
    <a href="logo.html" class="login-logo" title="Tres Marias Catering Services - Back to Logo">
      <img src="../assets/images/logo.jpg" alt="Tres Marias Catering Services Logo" class="login-logo-img">
    </a>

    <!-- Login Box with Front-end Validation -->
    <form class="login-box" id="login-form" novalidate>
      
      <!-- Top Alert Banner -->
      <div id="login-alert" class="login-alert" role="alert">
        <span id="alert-icon">⚠️</span>
        <span id="alert-text"></span>
      </div>

      <!-- Username / Email Field -->
      <div class="form-field">
        <label class="field-label" for="username-input">Username or Email</label>
        <input
          type="text"
          id="username-input"
          class="field-input"
          placeholder="admin@email.com"
          autocomplete="off"
          required
        >
        <span class="field-error-msg" id="username-error">Invalid username or email.</span>
      </div>

      <!-- Password Field -->
      <div class="form-field">
        <label class="field-label" for="password-input">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password-input"
            class="field-input has-toggle"
            placeholder="Password123"
            autocomplete="off"
            minlength="8"
            maxlength="32"
            required
          >
          <button type="button" class="btn-toggle-password" id="toggle-password" title="Show or hide password" aria-label="Toggle password visibility">
            <svg class="eye-icon-show" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-icon-hide" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>
        <span class="field-error-msg" id="password-error">Incorrect password.</span>
      </div>

      <!-- OTP & Send OTP Row -->
      <div class="form-field">
        <label class="field-label">One-Time PIN (OTP)</label>
        <div class="otp-row">
          <div class="otp-boxes">
            <input type="text" maxlength="1" class="otp-digit" id="otp1" placeholder=" " aria-label="OTP Digit 1" autocomplete="off" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="otp-digit" id="otp2" placeholder=" " aria-label="OTP Digit 2" autocomplete="off" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="otp-digit" id="otp3" placeholder=" " aria-label="OTP Digit 3" autocomplete="off" inputmode="numeric" pattern="[0-9]">
            <input type="text" maxlength="1" class="otp-digit" id="otp4" placeholder=" " aria-label="OTP Digit 4" autocomplete="off" inputmode="numeric" pattern="[0-9]">
          </div>
          <button type="button" class="btn-send-otp" id="btn-send-otp" disabled>Send OTP</button>
        </div>
        <span class="field-error-msg" id="otp-error">Invalid OTP code.</span>
        <p class="otp-error-msg">Invalid input: Numbers only (0-9).</p>
      </div>

      <!-- Log In Button -->
      <div class="login-btn-container">
        <button type="submit" class="btn-login" id="btn-login">Log In</button>
      </div>

    </form>
  </div>

  <!-- Login JavaScript -->
  <script src="../assets/js/login.js"></script>

</body>
</html>
